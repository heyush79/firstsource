target-version = "py311"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]
# Keep `class X(str, Enum)` instead of StrEnum: the explicit str mixin is the
# established pattern for Pydantic model / JSON-schema serialization.
ignore = ["UP042"]

[lint.per-file-ignores]
# Broad catches in the PDF helpers are deliberate: any parse failure must
# fall through to the vision path, never crash ingestion.
"cdih/ingest.py" = ["BLE001"]
