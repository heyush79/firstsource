name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 matches the Streamlit Cloud deployment
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Offline unit tests (ingestion + schema)
        run: pytest tests/ -v

  live-smoke-test:
    # Runs the real end-to-end extraction against the Gemini API.
    # Only on pushes to main, and only if the GOOGLE_API_KEY repo secret is set.
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: End-to-end pipeline smoke test
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret not configured — skipping live smoke test."
            exit 0
          fi
          python selftest.py --quick
